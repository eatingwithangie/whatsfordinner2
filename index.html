const rc=(a,b)=>a===b||COMP.has(a+'|'+b);

function attempt(diet,cap){
 const t=pick(DATA.tpl),codes=[...t.p.matchAll(/\{(\w+)\}/g)].map(m=>m[1]),pk={};
 for(const c of codes){
  let p=DATA.pool[c];
  if(t.o&&t.o[c])p=p.filter(x=>t.o[c].includes(x));
  if(c==='VEG')for(const d of t.f)if(DATA.dv[d])p=p.filter(x=>DATA.dv[d].includes(x));

 [...names,...t.f].forEach(n=>{toks.push(n,...tagsOf(n))});

 if(new Set(names).size!==names.length)return null;
 if(rulePairs.some(r=>S.has(r[0])&&S.has(r[1])))return null;
 const fl=FL.filter(c=>pk[c]).map(c=>pk[c]),bs=[...BASE.filter(c=>pk[c]).map(c=>pk[c]),...t.f.filter(f=>info[f])];
 for(let i=0;i<fl.length;i++)for(let j=i+1;j<fl.length;j++)if(!rok(fl[i],fl[j]))return null;
